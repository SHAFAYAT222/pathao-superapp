# Netlify Production Deployment Configuration for Pathao Super-App

[build]
  publish = "dist"
  command = "npm run build"

# SPA Fallback: Redirect all deep links and routes to index.html to prevent 404 errors
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets immutably
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security & CORS headers for SPA
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
